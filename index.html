async function put(col,id,data){
  const clean=JSON.parse(JSON.stringify(data));if(col==='tarefas')TN.eu.set(id,Date.now());
  if(col==='tarefas'&&!TALL.has(id)&&!D.tarefas.has(id)&&!clean.criadoPor){clean.criadoPor=meuNome();if(UID)clean.criadoUid=UID}
  if(col==='tarefas')TALL.set(id,clean);
  if(col==='tarefas'&&!MODL[clean.modulo])clean.modulo=D.tarefas.has(id)?'societario':(UI.mod||modDaCat(clean.categoria));
  D[col].set(id,clean);
  if(mode==='db'){
    try{await C(col).doc(id).set(clean)}
    catch(e){D[col].delete(id);if(col==='tarefas')TALL.delete(id);render();toast(e&&e.code==='quota_exceeded'?'Limite de registros atingido.':col==='equipe'?'Só a diretoria pode alterar a equipe.':(e&&e.message&&!/permission|42501|row-level/i.test(e.message)?e.message:'Seu acesso não permite essa alteração.'))}
  }else persistLocal();

}
async function del(col,id){
  if(col==='tarefas')TN.eu.set(id,Date.now());const old=D[col].get(id);if(old)gcalDrop(old,col==='empresas'?'c':'t');

  if(mode==='db'){try{await C(col).doc(id).delete()}catch(e){toast('Não foi possível excluir.')}}

  render();
}

function pc2(emp,nv){const g=emp&&emp.proxContato&&emp.proxContato.gcal;if(!g)return nv;if(nv){nv.gcal=g;return nv}gcalDrop(emp,'c');return null}
function gcalWantT(t){return t.status!=='concluida'&&!!t.prazo}
function gcalSpecT(t){
  const e=empresa(t.empresaId);
  const desc=[`Empresa: ${empNome(t.empresaId)}${e&&e.cnpj?' ('+e.cnpj+')':''}`,t.categoria?'Categoria: '+t.categoria:'','Responsável: '+(t.responsavel||'—'),'Status: '+ST[t.status].l,t.prioridade&&t.prioridade!=='normal'?'Prioridade: '+PRI[t.prioridade]:'',t.descricao?'\n'+t.descricao:'','\nGestor de Tarefas'].filter(Boolean).join('\n');

function gcalSpecC(e){const pc=e.proxContato;return {summary:`Retorno: ${e.fantasia||e.razao}${pc.desc?' — '+pc.desc:''}`,date:pc.data,description:[`Empresa: ${e.razao||''}${e.cnpj?' ('+e.cnpj+')':''}`,e.whatsapp?'WhatsApp: '+e.whatsapp:'',e.telefone?'Telefone: '+e.telefone:'','\nGestor de Tarefas'].filter(Boolean).join('\n')}}
const sigOf=sp=>sp.date+'|'+sp.summary+'|'+sp.description;
function gcalArgs(sp){return {summary:sp.summary,description:sp.description,allDay:true,startTime:sp.date+'T00:00:00',endTime:addD(sp.date,1)+'T00:00:00',availability:'AVAILABILITY_FREE'}}
function evId(p){if(!p||typeof p!=='object')return null;return p.id||p.eventId||(p.event&&p.event.id)||null}
function evLink(p){return p&&(p.htmlLink||(p.event&&p.event.htmlLink))||''}
const gDropQ=[];
function gcalDrop(obj,kind){const g=kind==='c'?(obj.proxContato&&obj.proxContato.gcal):obj.gcal;if(g&&g.id&&gcalOn()){gDropQ.push(g.id);gcalSchedule(300)}}
function gcalSchedule(ms){if(!gcalOn()||!G.auto)return;clearTimeout(gTmr);gTmr=setTimeout(()=>gcalSync(false),ms||2500)}
function gErrTxt(e){
  const c=e&&e.code;
  return {server_not_connected:'Conecte o Google Calendar em Configurações → Conectores do claude.ai.',needs_reauth:'Reconecte o Google Calendar em Configurações → Conectores do claude.ai.',selection_required:'Escolha qual conta Google usar no aviso que o Claude mostrou e sincronize de novo.',not_in_manifest:'O acesso à Google Agenda não foi liberado para esta página. Libere em Permissões e sincronize de novo.',blocked_by_policy:'A política da organização bloqueia a Google Agenda nesta página.',approval_required:'A Google Agenda pediu aprovação. Clique em Sincronizar agora e permita.',server_unavailable:'Google Agenda fora do ar agora. Tento de novo na próxima sincronização.',not_granted:'Esta visualização não tem acesso a conectores.',capability_disabled:'Esta visualização não tem acesso a conectores.'}[c]||('Erro na Google Agenda: '+((e&&e.message)||'falha desconhecida'));
}
const gStop=e=>e&&!['tool_error'].includes(e.code);
async function gcalSync(manual){
  if(!gcalOn())return;
  if(G.busy){G.again=true;return}
  G.busy=true;G.err='';firstSync=false;let n=0;renderGBar();
  try{
    while(gDropQ.length){const id=gDropQ[0];try{await mcp.callTool(GC,'delete_event',{eventId:id,notificationLevel:'NONE'})}catch(e){if(gStop(e))throw e}gDropQ.shift();n++}
    for(const [id,t] of [...D.tarefas.entries()]){
      const want=gcalWantT(t),g=t.gcal;
      if(want){const sp=gcalSpecT(t),sig=sigOf(sp);if(g&&g.id&&g.sig===sig)continue;
        let ev=null;
        if(g&&g.id){try{await mcp.callTool(GC,'update_event',Object.assign({eventId:g.id,notificationLevel:'NONE'},gcalArgs(sp)));ev={id:g.id,link:g.link}}catch(e){if(gStop(e))throw e}}
        if(!ev){const r=await mcp.callTool(GC,'create_event',Object.assign({useDefaultReminders:true},gcalArgs(sp)));const eid=evId(r.payload);if(!eid)continue;ev={id:eid,link:evLink(r.payload)}}
        await gcalSave('tarefas',id,{gcal:{id:ev.id,sig,link:ev.link||''}});n++;
      }else if(g&&g.id){try{await mcp.callTool(GC,'delete_event',{eventId:g.id,notificationLevel:'NONE'})}catch(e){if(gStop(e))throw e}await gcalSave('tarefas',id,{gcal:null});n++}
    }
    for(const [id,e] of [...D.empresas.entries()]){
      const pc=e.proxContato;if(!pc)continue;const g=pc.gcal;
      if(pc.data){const sp=gcalSpecC(e),sig=sigOf(sp);if(g&&g.id&&g.sig===sig)continue;let ev=null;
        if(g&&g.id){try{await mcp.callTool(GC,'update_event',Object.assign({eventId:g.id,notificationLevel:'NONE'},gcalArgs(sp)));ev={id:g.id,link:g.link}}catch(err){if(gStop(err))throw err}}
        if(!ev){const r=await mcp.callTool(GC,'create_event',Object.assign({useDefaultReminders:true},gcalArgs(sp)));const eid=evId(r.payload);if(!eid)continue;ev={id:eid,link:evLink(r.payload)}}
        await gcalSave('empresas',id,{proxContato:Object.assign({},pc,{gcal:{id:ev.id,sig,link:ev.link||''}})});n++}
    }
    G.last=agora();lsSet('cs.gcal.last',G.last);G.n=n;
    if(manual)toast(n?`Google Agenda atualizada (${plural(n,'alteração','alterações')})`:'Google Agenda já estava em dia');
  }catch(e){G.err=gErrTxt(e);if(manual)toast('Não foi possível sincronizar')}
  G.busy=false;renderGBar();
  if(G.again){G.again=false;gcalSchedule(1500)}
}
async function gcalSave(col,id,patch){

  try{await C(col).doc(id).update(JSON.parse(JSON.stringify(patch)))}catch(e){}
}

const empresa=id=>D.empresas.get(id);
const empNome=id=>{const e=empresa(id);return e?(e.fantasia||e.razao):'Sem empresa'};
function info(t){
  const h=hoje(),aberta=t.status!=='concluida';
  const atraso=aberta&&t.prazo&&t.prazo<h?dias(t.prazo,h):0;
  const ate=aberta&&t.prazo?dias(h,t.prazo):null;
  const upd=(t.atualizadoEm||t.criadoEm||h).slice(0,10);
  const semUpd=aberta?dias(upd,h):0;
  const cobs=(t.hist||[]).filter(x=>x.tipo==='cobranca');
  const lastCob=cobs.length?cobs.map(x=>x.em).sort().pop():null;
  const parado=aberta&&semUpd>=SEM_UPD;
  return {aberta,atraso,ate,semUpd,parado,upd,
    cobrar:aberta&&(atraso>0||parado),
    cobradoHoje:!!lastCob&&lastCob.slice(0,10)===h,lastCob,nCob:cobs.length,
    emAberto:dias((t.criadoEm||h).slice(0,10),aberta?h:(t.concluidoEm||h).slice(0,10))};
}
function tarefas(){let a=[...D.tarefas.entries()].map(([id,t])=>Object.assign({id},t));if(UI.mod)a=a.filter(t=>modDe(t)===UI.mod);if(UI.resp)a=a.filter(t=>respHit(t,UI.resp));return a}
function responsaveis(){const s=new Set(equipeLista().map(p=>p.nome));if(!s.size)RESP_PADRAO.forEach(r=>s.add(r));D.tarefas.forEach(t=>{if(t.responsavel&&![...s].some(x=>norm(x)===norm(t.responsavel)))s.add(t.responsavel)});return [...s]}
const byPrazo=(a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999');
function cobrarList(){
  return tarefas().map(t=>Object.assign(t,{_i:info(t)})).filter(t=>t._i.cobrar)
    .sort((a,b)=>(a._i.cobradoHoje-b._i.cobradoHoje)||(b._i.atraso-a._i.atraso)||(b._i.semUpd-a._i.semUpd));
}
function lembretes(){
  const h=hoje();const a=[];
  D.empresas.forEach((e,id)=>{if(e.proxContato&&e.proxContato.data){if(UI.resp&&e.responsavel&&e.responsavel!==UI.resp)return;a.push({id,e,data:e.proxContato.data,desc:e.proxContato.desc||'',d:dias(h,e.proxContato.data)})}});

function graficos(all){

  const ab=all.filter(t=>t.status!=='concluida'&&t.prazo&&t.prazo<h);
  const porR={};ab.forEach(t=>{const k=t.responsavel||'Sem responsável';porR[k]=(porR[k]||0)+1});
  const rr=Object.entries(porR).sort((a,b)=>b[1]-a[1]).slice(0,8);const mr=Math.max(1,...rr.map(x=>x[1]));
  const hbar=(l,n,m,c)=>`<div class="gh-row"><span class="gh-l">${esc(l)}</span><div class="gh-t"><i style="width:${n/m*100}%;background:${c}"></i></div><b class="mono">${n}</b></div>`;

      ${!UI.mod&&porM.length?`<div class="gr-t" style="margin-top:14px">Por módulo</div>${porM.map(([l,n,c])=>hbar(l,n,mm,c)).join('')}`:''}</div>

function filtrar(list){
  const h=hoje();let a=list;
  if(UI.q){const q=UI.q.toLowerCase();a=a.filter(t=>[t.titulo,t.categoria,empNome(t.empresaId),(empresa(t.empresaId)||{}).razao,(empresa(t.empresaId)||{}).cnpj,t.descricao,t.solicitante,t.departamento,t.responsavel].join(' ').toLowerCase().includes(q))}
  if(UI.fStatus)a=a.filter(t=>t.status===UI.fStatus);
  if(UI.fCat)a=a.filter(t=>t.categoria===UI.fCat);
  if(UI.fPri)a=a.filter(t=>t.prioridade===UI.fPri);
  if(UI.fDep)a=a.filter(t=>t.departamento===UI.fDep);
  if(UI.fPrazo==='hoje')a=a.filter(t=>t.status!=='concluida'&&t.prazo===h);
  if(UI.fPrazo==='atrasadas')a=a.filter(t=>t.status!=='concluida'&&t.prazo&&t.prazo<h);
  if(UI.fPrazo==='proximas')a=a.filter(t=>t.status!=='concluida'&&t.prazo&&t.prazo>h&&dias(h,t.prazo)<=PROX);
  if(UI.fPrazo==='mes')a=a.filter(t=>t.status==='concluida'&&(t.concluidoEm||'').slice(0,7)===h.slice(0,7));
  if(!UI.concl&&!UI.fStatus&&UI.fPrazo!=='mes'&&UI.modo!=='kanban')a=a.filter(t=>t.status!=='concluida');
  return a;
}

const AV_T={recado:['Recado','#4f8fe8'],aviso:['Aviso geral','#9b7cf2'],empresa:['Nova empresa','#3fb67e'],urgente:['Importante','#e5534b'],festa:['Comemoração','#e0a040']};
function aniv(p){const a=p&&p.aniversario;if(!a||!/^\d{4}-\d{2}-\d{2}$/.test(a))return null;const h=toD(hoje()),y=h.getFullYear();let d=new Date(y,+a.slice(5,7)-1,+a.slice(8,10));if(d<h)d=new Date(y+1,+a.slice(5,7)-1,+a.slice(8,10));const n=Math.round((d-h)/864e5);const ano=+a.slice(0,4);return {dias:n,dm:a.slice(8,10)+'/'+a.slice(5,7),idade:ano>1900?d.getFullYear()-ano:null,mes:+a.slice(5,7)}}
function aniversariantes(){return equipeLista().map(p=>Object.assign({a:aniv(p)},p)).filter(p=>p.a).sort((x,y)=>x.a.dias-y.a.dias)}
function avisosLista(todos){const h=hoje();return [...D.avisos.entries()].map(([id,a])=>Object.assign({id},a)).filter(a=>todos||!a.ate||a.ate>=h).sort((x,y)=>(y.fixo?1:0)-(x.fixo?1:0)||(y.criadoEm||'').localeCompare(x.criadoEm||''))}
function muralNovos(){if(WS==='pessoal')return 0;const v=lsGet('cs.muralVisto','');let n=0;D.avisos.forEach(a=>{if((a.criadoEm||'')>v&&!souEu(a.autor)&&(!a.ate||a.ate>=hoje()))n++});return n}
function avCard(a){const t=AV_T[a.tipo]||AV_T.aviso;
  return `<article class="avs ${a.fixo?'fixo':''}" style="--c:${t[1]}"><div class="av-h"><span class="av-t">${esc(t[0])}</span>${a.fixo?`<span class="av-pin">${svg('pin')}Fixado</span>`:''}<span class="sp"></span><span class="av-d">${fmt(a.criadoEm)} · ${String(a.criadoEm||'').slice(11,16)}</span></div>
  <h3>${esc(a.titulo||'')}</h3>${a.texto?`<p>${esc(a.texto).replace(/\n/g,'<br>')}</p>`:''}
  <div class="av-f"><span>Por <b>${esc(a.autor||'—')}</b>${a.ate?` · até ${fmt(a.ate)}`:''}</span>${a.empresaId&&D.empresas.has(a.empresaId)?`<a href="#" data-emp="${a.empresaId}">Abrir empresa</a>`:''}${(()=>{const m=a.tipo==='empresa'&&a.empresaId&&D.empresas.has(a.empresaId)?emailNovaEmpresa(D.empresas.get(a.empresaId)):{assunto:'[Mural] '+(a.titulo||''),corpo:(a.titulo||'')+'\n\n'+(a.texto||'')+'\n\n— '+(a.autor||'')+' · Gestor de Tarefas'};const l=mailtoEquipe(m.assunto,m.corpo);return l?`<a href="${l}" target="_blank" rel="noopener" title="Enviar este aviso por e-mail para a equipe">${svg('chat')}E-mail</a>`:''})()}<span class="sp"></span><button class="btn ghost sm" data-av-fix="${a.id}">${a.fixo?'Desafixar':'Fixar'}</button><button class="btn ghost sm" data-av-edit="${a.id}">Editar</button><button class="btn ghost sm danger" data-av-del="${a.id}">Excluir</button></div></article>`}

  </div>`;
  document.body.appendChild(el);
  const fim=()=>{el.classList.add('out');setTimeout(()=>{el.remove();festaCheck.on=false},350)};
  el.addEventListener('click',e=>{if(e.target===el||e.target.id==='festaCv'||e.target.closest('[data-festa-fim]'))fim()});
  document.addEventListener('keydown',function kd(e){if(e.key==='Escape'){fim();document.removeEventListener('keydown',kd)}});
  setTimeout(()=>{const b=el.querySelector('[data-festa-fim]');if(b)b.focus()},50);
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=el.querySelector('#festaCv'),cx=cv.getContext('2d');let W,H;const dpr=Math.min(2,window.devicePixelRatio||1);
  const rs=()=>{W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr};rs();addEventListener('resize',rs);
  const cores=['#f6c344','#e5534b','#4f8fe8','#3fb67e','#9b7cf2','#f08bb4','#ffffff'];
  const P=[];const burst=(x,y,n,up)=>{for(let i=0;i<n;i++){const a=up?(-Math.PI/2+(Math.random()-.5)*1.3):Math.random()*Math.PI*2,v=(up?9:5)+Math.random()*9;P.push({x,y,vx:Math.cos(a)*v*dpr,vy:Math.sin(a)*v*dpr,r:(3+Math.random()*5)*dpr,c:cores[i%cores.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,sh:Math.random()<.35?1:0,life:1})}};
  burst(W*.15,H,90,true);burst(W*.85,H,90,true);setTimeout(()=>burst(W*.5,H*.35,120),450);setTimeout(()=>{burst(W*.25,H*.3,70);burst(W*.75,H*.3,70)},1100);
  let rain=0;const t0=performance.now();
  (function loop(t){if(!document.body.contains(cv))return;cx.clearRect(0,0,W,H);
    if(t-t0<6000&&rain++%3===0)P.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*2*dpr,vy:2*dpr,r:(3+Math.random()*4)*dpr,c:cores[Math.floor(Math.random()*cores.length)],rot:0,vr:.1,sh:Math.random()<.4?1:0,life:1});
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.18*dpr;p.vx*=.99;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>H+30){P.splice(i,1);continue}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;if(p.sh){cx.beginPath();cx.arc(0,0,p.r*.6,0,7);cx.fill()}else cx.fillRect(-p.r/2,-p.r,p.r,p.r*2);cx.restore()}
    if(P.length||t-t0<6000)requestAnimationFrame(loop)})(t0);
}

/* ---------- Rendimento ---------- */
const RD_DIAS=30;
const rdKey=n=>norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
function rdCalc(nome){
  const h=hoje(),ini=addD(h,-RD_DIAS),iniAnt=addD(h,-2*RD_DIAS);
  const ts=[...D.tarefas.values()].filter(t=>norm(t.responsavel)===norm(nome));
  const conc=ts.filter(t=>t.status==='concluida'&&t.concluidoEm&&t.concluidoEm.slice(0,10)>ini);
  const concAnt=ts.filter(t=>t.status==='concluida'&&t.concluidoEm&&t.concluidoEm.slice(0,10)>iniAnt&&t.concluidoEm.slice(0,10)<=ini);
  const comPz=conc.filter(t=>t.prazo);const noPz=comPz.filter(t=>t.concluidoEm.slice(0,10)<=t.prazo).length;
  const pct=comPz.length?Math.round(noPz/comPz.length*100):null;
  const ab=ts.filter(t=>t.status!=='concluida');const atr=ab.filter(t=>t.prazo&&t.prazo<h);
  const parad=ab.filter(t=>{const i=info(t);return i.parado}).length;
  const med=conc.length?Math.round(conc.reduce((s,t)=>s+dias((t.criadoEm||t.concluidoEm).slice(0,10),t.concluidoEm.slice(0,10)),0)/conc.length):null;
  const sem=[];for(let i=7;i>=0;i--){const a=addD(h,-7*(i+1)),b=addD(h,-7*i);sem.push(ts.filter(t=>t.status==='concluida'&&t.concluidoEm&&t.concluidoEm.slice(0,10)>a&&t.concluidoEm.slice(0,10)<=b).length)}
  const motivos=[];
  if(atr.length>=3)motivos.push(plural(atr.length,'tarefa atrasada','tarefas atrasadas'));
  if(pct!==null&&comPz.length>=4&&pct<70)motivos.push(`só ${pct}% entregues no prazo`);
  if(concAnt.length>=5&&conc.length<=concAnt.length*0.6)motivos.push(`entregas caíram de ${concAnt.length} para ${conc.length}`);
  if(parad>=3)motivos.push(plural(parad,'tarefa parada','tarefas paradas')+' sem atualização');
  return {conc:conc.length,concAnt:concAnt.length,pct,ab:ab.length,atr:atr.length,parad,med,sem,motivos,alerta:motivos.length>0};
}
function rdDoc(nome){return D.rendimento.get(rdKey(nome))||null}
function rdPapel(nome){if(souEu(nome))return 'eu';const n=rbNivel();if(n==='total')return 'diretoria';if(n==='depto'&&norm(depDe(nome))===norm(rbMeuDep()))return 'gestor';return ''}
function rdLiberaEm(nome,d){if(!d||!d.alertaEm)return null;const temG=rbTemGestor(nome);return {gestor:addD(d.alertaEm,7),diretoria:addD(d.alertaEm,temG?14:7)}}
function rdVeAlerta(nome,d){const p=rdPapel(nome);if(!d||!d.alertaEm||d.resolvidoEm)return false;if(MESTRE.ok)return true;if(p==='eu')return true;const l=rdLiberaEm(nome,d);
  if(p==='gestor')return hoje()>=l.gestor;
  if(p==='diretoria')return hoje()>=l.diretoria||(d.feedbacks||[]).some(f=>f.papel==='gestor');return false}
function rdPessoas(){return equipeLista().filter(p=>norm(p.departamento)!=='diretoria'&&(rbTotal()?true:souEu(p.nome)))}
function rdMeusAlertas(){if(WS==='pessoal'||!loaded.rendimento)return 0;let n=0;equipeLista().forEach(p=>{if(!(rbTotal()||souEu(p.nome)))return;const d=rdDoc(p.nome);if(rdVeAlerta(p.nome,d)&&!(d.vistoPor||{})[rdKey(ME)])n++});return n}
let rdTmr=null;
function rdSync(){if(!rbTotal()||WS==='pessoal'||!loaded.tarefas||!loaded.equipe||!loaded.rendimento)return;clearTimeout(rdTmr);rdTmr=setTimeout(()=>{
  equipeLista().forEach(p=>{if(norm(p.departamento)==='diretoria')return;const c=rdCalc(p.nome),k=rdKey(p.nome),d=D.rendimento.get(k)||{};
    if(c.alerta&&(!d.alertaEm||d.resolvidoEm))put('rendimento',k,Object.assign({},d,{nome:p.nome,alertaEm:hoje(),resolvidoEm:'',motivos:c.motivos,vistoPor:{},hist:(d.hist||[]).concat([{em:agora(),txt:'Alerta aberto: '+c.motivos.join('; ')}])}));
    else if(!c.alerta&&d.alertaEm&&!d.resolvidoEm)put('rendimento',k,Object.assign({},d,{resolvidoEm:hoje(),hist:(d.hist||[]).concat([{em:agora(),txt:'Rendimento voltou ao normal'}])}));
  })},1500)}
const spark=a=>{const m=Math.max(1,...a);return `<span class="spk">${a.map(v=>`<i style="height:${Math.max(8,v/m*100)}%"></i>`).join('')}</span>`};
function rdStatus(p,c,d){const ve=rdVeAlerta(p.nome,d);const papel=rdPapel(p.nome);
  if(ve)return ['red',papel==='eu'?'Atenção ao seu rendimento':'Precisa de feedback'];
  if(d&&d.alertaEm&&!d.resolvidoEm&&papel!=='eu')return ['',''];
  return c.alerta&&papel==='eu'?['amb','Em observação']:c.alerta?['','']:['grn','Em dia']}
function vRendimento(){

      <div class="rd-f">${spark(c.sem)}<span>últimas 8 semanas</span><span style="margin-left:auto">${fb?plural(fb,'feedback','feedbacks'):''}</span></div></button>`}).join('');
  return `${dEu&&rdVeAlerta(eu.nome,dEu)?`<div class="reminder" style="background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,transparent)">${svg('perf')}<div style="flex:1;min-width:200px"><b style="color:var(--red)">Seu rendimento precisa de atenção</b> · ${esc((dEu.motivos||[]).join(' · '))}<div style="font-size:12px;color:var(--mut)">Você está sendo avisado(a) primeiro. Se não melhorar, o gestor vê em ${fmt(rdLiberaEm(eu.nome,dEu).gestor)}.</div></div><button class="btn sm" data-rd="${esc(eu.nome)}">Ver detalhes</button></div>`:''}
  <div class="rd-grid">${cards}</div>
  <div style="font-size:12px;color:var(--dim)">Cada pessoa vê o próprio rendimento; o gestor vê o seu departamento e a diretoria vê todos. Quando o rendimento cai, a pessoa é avisada primeiro; o gestor só vê o alerta 7 dias depois e a diretoria 14 dias depois (ou quando o gestor registrar um feedback).</div>`;

const CHAT={sel:'todos',ini:false,ids:new Set()};
function chatKey(m){if(m.para==='todos')return 'todos';return souEu(m.de)?m.para:m.de}
function chatMeu(m){return m.para==='todos'||souEu(m.para)||souEu(m.de)||(UID&&m.deUid===UID)}
function chatLista(){return [...D.chat.entries()].map(([id,m])=>Object.assign({id},m)).filter(chatMeu).sort((a,b)=>(a.em||'').localeCompare(b.em||''))}
function chatLido(){return lsGet('cs.chatLido',{})}
function chatNaoLidasDe(k){const l=chatLido()[k]||'';return chatLista().filter(m=>chatKey(m)===k&&!souEu(m.de)&&(m.em||'')>l).length}
function chatNaoLidas(){if(mode!=='db'||!loaded.chat)return 0;const l=chatLido();return chatLista().filter(m=>!souEu(m.de)&&(m.em||'')>(l[chatKey(m)]||'')).length}
function chatMarcar(){if(UI.view!=='chat')return;const o=chatLido();const ult=chatLista().filter(m=>chatKey(m)===CHAT.sel).map(m=>m.em||'').sort().pop();if(ult&&o[CHAT.sel]!==ult){o[CHAT.sel]=ult;lsSet('cs.chatLido',o)}}
function chatNovas(m){if(!CHAT.ini){CHAT.ini=true;m.forEach((_,id)=>CHAT.ids.add(id));return}
  m.forEach((x,id)=>{if(CHAT.ids.has(id))return;CHAT.ids.add(id);const msg=Object.assign({id},x);if(!chatMeu(msg)||souEu(msg.de))return;
    if(UI.view==='chat'&&CHAT.sel===chatKey(msg)&&!document.hidden&&document.hasFocus())return;notificar('💬 '+(msg.de||'Mensagem')+(msg.para==='todos'?' (geral)':''),String(msg.txt||'').slice(0,140),()=>{CHAT.sel=chatKey(msg);go('chat')});toast('💬 '+(msg.de||'Alguém').split(' ')[0]+(msg.para==='todos'?' (geral)':'')+': '+String(msg.txt||'').slice(0,60))})}

  const item=(k,nome,av)=>{const n=chatNaoLidasDe(k);return `<button class="${CHAT.sel===k?'on':''}" data-chat-sel="${esc(k)}">${av}<span class="nm">${esc(nome)}<small>${ult(k)||'&nbsp;'}</small></span>${n?`<span class="ct" style="position:static">${n}</span>`:''}</button>`};
  const avP=p=>{const id=onlineIds().find(i=>{const q=PROF[i];return q&&q.name&&(norm(q.name)===norm(p.nome)||norm(q.name).split(' ')[0]===norm(p.nome).split(' ')[0])});const pr=id?PROF[id]:null;return `<span class="on-wrap">${aviHtml(pr&&pr.avatarUrl,p.nome,'')}${id?'<i class="dot"></i>':''}</span>`};
  let dia='';const corpo=msgs.map(m=>{const d=(m.em||'').slice(0,10);const sep=d!==dia?(dia=d,`<div class="chat-day">${d===hoje()?'Hoje':fmt(d)}</div>`):'';const eu=souEu(m.de)||(UID&&m.deUid===UID);const pr=m.deUid?PROF[m.deUid]:null;
    return sep+`<div class="cm ${eu?'eu':''}">${eu?'':aviHtml(pr&&pr.avatarUrl,m.de,'sm')}${eu||rbTotal()?`<button class="cm-x" data-chat-del="${esc(m.id)}" title="Apagar mensagem" aria-label="Apagar mensagem">×</button>`:''}<div class="bb">${!eu&&CHAT.sel==='todos'?`<b>${esc((m.de||'').split(' ')[0])}</b>`:''}${esc(m.txt)}<small>${esc((m.em||'').slice(11,16))}</small></div></div>`}).join('');

}
function chatPos(fq){const b=document.getElementById('chatMsgs');if(b)b.scrollTop=b.scrollHeight;const f=document.getElementById('chatForm'),t=document.getElementById('chatIn');if(!f||!t)return;

/* ---------- Parabéns da semana ---------- */
function segundaDe(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return isoD(x)}
const META_DEP=[['fiscal',40],['contab',25],['pessoal',25],['dp',25],['societ',10]];
function metaBase(nome){const d=norm(depDe(nome)||'');const m=META_DEP.find(([k])=>d.includes(k));return m?m[1]:15}
function concluidasEntre(ini,fim){const r={};TALL.forEach(t=>{if(t.status!=='concluida'||!t.concluidoEm||!t.responsavel)return;const d=t.concluidoEm.slice(0,10);if(d<ini||d>fim)return;r[t.responsavel]=(r[t.responsavel]||0)+1});return r}
function concluidasSemana(){return concluidasEntre(segundaDe(new Date()),hoje())}
function metaSemana(nome){const w=new Date(segundaDe(new Date())+'T12:00');const ini=isoD(new Date(w.getTime()-28*864e5)),fim=isoD(new Date(w.getTime()-864e5));const c=concluidasEntre(ini,fim);let n=0;Object.keys(c).forEach(p=>{if(norm(p)===norm(nome))n+=c[p]});return Math.max(metaBase(nome),Math.ceil(n/4*1.3))}
function semanaCheck(){
  if(mode==='loading'||WS==='pessoal'||!loaded.tarefas||!loaded.equipe||festaCheck.on)return;
  const d=new Date(),dw=d.getDay();if(!((dw===5&&d.getHours()>=12)||dw===6||dw===0))return;
  const w=segundaDe(d),c=concluidasSemana();
  let meu=0,meuNm='';Object.keys(c).forEach(p=>{if(souEu(p)){meu+=c[p];meuNm=p}});
  const k='cs.semana.'+w;
  if(meuNm&&!lsGet(k,false)){const mt=metaSemana(meuNm);if(meu>=mt){lsSet(k,true);
    const tier=meu>=mt*2?['🏆','Semana espetacular','Você dobrou a meta da semana!']:meu>=mt*1.5?['🥇','Semana incrível','Bem acima da meta, continue assim!']:['🎉','Meta da semana batida','Muito bom ver as entregas acontecendo.'];
    festaShow(null,`<div class="fe-trofeu" aria-hidden="true">${tier[0]}</div><div class="fe-k">${tier[1]} na Londe &amp; Rodrigues</div><h2>Parabéns,<br><span>${esc(ME)}!</span></h2><p>Você concluiu <b>${meu} tarefas</b> nesta semana (meta: ${mt}). ${tier[2]} Bom fim de semana! 😄</p><div class="fe-acts"><button class="btn pri" data-festa-fim>Obrigado!</button></div>`)}}
  if(rbTotal()&&canWrite&&loaded.avisos&&!D.avisos.has('semana-'+w)){
    const top=Object.entries(c).map(([p,n])=>[p,n,metaSemana(p)]).filter(([p,n,mt])=>n>=mt).sort((a,b)=>b[1]/b[2]-a[1]/a[2]);

function pzRegra(cat){const o=obDe(cat);if(o&&o.regra&&o.regra.tipo)return Object.assign({},o.regra,{aviso:o.aviso!=null?o.aviso:3});const r=pzConf().regras||{};const k=Object.keys(r).find(x=>norm(x)===norm(cat||''));return k?r[k]:null}

function pascoaData(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia)}
const FER_CACHE={};function feriados(y){if(FER_CACHE[y])return FER_CACHE[y];const s=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));const p=pascoaData(y);p.setDate(p.getDate()-2);s.add(isoD(p));return FER_CACHE[y]=s}
const naoUtil=d=>d.getDay()===0||d.getDay()===6||feriados(d.getFullYear()).has(isoD(d));
const antecipaF=d=>{while(naoUtil(d))d.setDate(d.getDate()-1);return d};
function antecipa(d){while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d}
function prorroga(d){while(naoUtil(d))d.setDate(d.getDate()+1);return d}
function pzCalc(rg,base){const h=base?toD(base):toD(hoje());const y=h.getFullYear(),m=h.getMonth();let d;const antecipa=rg.prorroga?prorroga:antecipaF;
  if(rg.tipo==='dia'){d=antecipa(new Date(y,m,+rg.dia||20));if(d<h)d=antecipa(new Date(y,m+1,+rg.dia||20))}
  else if(rg.tipo==='anual'){const [mm,dd]=String(rg.data||'12-31').split('-').map(Number);d=antecipa(new Date(y,mm-1,dd));if(d<h)d=antecipa(new Date(y+1,mm-1,dd))}
  else if(rg.tipo==='utilMes'&&!+rg.mes){d=antecipa(new Date(y,m+1,0));if(d<h)d=antecipa(new Date(y,m+2,0))}
  else if(rg.tipo==='utilMes'){d=antecipa(new Date(y,+rg.mes,0));if(d<h)d=antecipa(new Date(y+1,+rg.mes,0))}

function rotModal(){if(!GT.gestor())return;const c=rotConf();const comp=hoje().slice(0,7);
  const obs=obLista().filter(o=>o.ativo!==false&&(o.regimes||[]).length);
  openModal(`${mh('Rotinas mensais por cliente')}<div class="mb"><div style="font-size:12.5px;color:var(--mut)">Todo dia 1º o sistema cria as tarefas das obrigações que têm regimes marcados, para cada empresa ativa daquele regime (mensais todo mês; anuais no mês do vencimento). O responsável é o "Responsável no escritório" da empresa. Nunca cria a mesma tarefa duas vezes. Para escolher o que entra, edite em <b>Obrigações</b>.</div>
    <div>${obs.length?`<ul style="margin:0;padding-left:18px;font-size:13px">${obs.map(o=>`<li><b>${esc(o.nome)}</b> · ${esc(PERS[o.per]||'')} · ${esc(o.regimes.join(', '))}</li>`).join('')}</ul>`:'<div class="gd-msg">Nenhuma obrigação com regime marcado.</div>'}</div>
    <label class="chk"><input type="checkbox" id="rtOn" ${c.ativo?'checked':''}> <b>Ligar a criação automática todo dia 1º</b></label><div id="rtPrev" style="font-size:12.5px"></div></div>
    <div class="mf"><button type="button" class="btn" onclick="this.dispatchEvent(new CustomEvent('gt-ir',{bubbles:true,detail:'obrigacoes'}))">Abrir Obrigações</button><button type="button" class="btn" id="rtVer">Ver quantas seriam criadas</button><button type="button" class="btn pri" id="rtSalvar">Salvar</button></div>`,true);
  $('#rtVer').onclick=()=>{const l=rotLista(comp);$('#rtPrev').innerHTML=l.length?`Para ${comp.slice(5)}/${comp.slice(0,4)}: <b>${plural(l.length,'tarefa nova','tarefas novas')}</b>. <button type="button" class="btn sm pri" id="rtJa">Criar agora</button>`:'Nenhuma tarefa nova para este mês.';
    const b=document.getElementById('rtJa');if(b)b.onclick=()=>{const on=$('#rtOn').checked;confirmBox(`Criar <b>${l.length}</b> tarefas agora?`,'Criar',async()=>{await db.doc('config/rotinas').set({ativo:on});ROT={ativo:on};lsSet('gt.rot.'+comp,true);const n=await rotGerar(comp);closeModal();toast(plural(n,'tarefa criada','tarefas criadas'))})}};
  $('#rtSalvar').onclick=async()=>{const o={ativo:$('#rtOn').checked};try{await db.doc('config/rotinas').set(o);ROT=o;closeModal();toast(o.ativo?'Rotinas ligadas':'Rotinas desligadas')}catch(e){toast('Só gestor e diretoria podem alterar.')}};
}
/* ---------- Tempo gasto ---------- */
const minTxt=m=>{m=Math.round(m||0);return m<60?m+' min':Math.floor(m/60)+'h'+(m%60?' '+pad(m%60):'')};
function tempoAtual(t){return (t.tempo||0)+(t.timer&&t.timer.desde?Math.max(0,(Date.now()-new Date(t.timer.desde))/6e4):0)}
function tempoToggle(id){const t=D.tarefas.get(id);if(!t)return;const now=agora();
  if(t.timer&&t.timer.desde){const gasto=Math.max(1,Math.round((Date.now()-new Date(t.timer.desde))/6e4));
    put('tarefas',id,Object.assign({},t,{tempo:(t.tempo||0)+gasto,timer:null,atualizadoEm:now,hist:(t.hist||[]).concat([{em:now,tipo:'nota',txt:'Trabalhou '+minTxt(gasto)+' (total '+minTxt((t.tempo||0)+gasto)+')',por:t.timer.por||ME}])}));toast('Tempo registrado: '+minTxt(gasto))}
  else{D.tarefas.forEach((o,oid)=>{if(oid!==id&&o.timer&&o.timer.desde&&souEu(o.timer.por))tempoToggle(oid)});
    put('tarefas',id,Object.assign({},t,{timer:{por:ME,desde:new Date().toISOString()},atualizadoEm:now}));toast('⏱ Cronômetro iniciado')}
  setTimeout(()=>taskView(id),150)}
function tempoLancar(id){const t=D.tarefas.get(id);if(!t)return;const v=prompt('Quantos minutos trabalhou nesta tarefa?','30');const m=Math.round(+String(v||'').replace(',','.'));if(!(m>0))return;const now=agora();
  put('tarefas',id,Object.assign({},t,{tempo:(t.tempo||0)+m,atualizadoEm:now,hist:(t.hist||[]).concat([{em:now,tipo:'nota',txt:'Lançou '+minTxt(m)+' trabalhados (total '+minTxt((t.tempo||0)+m)+')',por:ME}])}));setTimeout(()=>taskView(id),150)}
const fmtTam=b=>b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
async function anexoEnviar(id,files){const t=D.tarefas.get(id);if(!t||!files||!files.length)return;const org=GT.membro&&GT.membro.org_id;if(!org){toast('Faça login para anexar.');return}
  const novos=[];for(const f of files){if(f.size>10485760){toast(f.name+': máximo 10 MB.');continue}
    const nome=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);const path=org+'/'+id+'/'+Date.now().toString(36)+'-'+nome;
    toast('Enviando '+f.name+'…');const {error}=await GT.sb.storage.from('anexos').upload(path,f,{contentType:f.type||'application/octet-stream'});
    if(error){toast('Não foi possível enviar '+f.name+'.');continue}novos.push({nome:f.name,path,tam:f.size,por:ME,em:agora()})}
  if(!novos.length)return;const cur=D.tarefas.get(id)||t;const now=agora();
  await put('tarefas',id,Object.assign({},cur,{anexos:(cur.anexos||[]).concat(novos),atualizadoEm:now,hist:(cur.hist||[]).concat([{em:now,tipo:'nota',txt:'Anexou: '+novos.map(a=>a.nome).join(', '),por:ME}])}));toast(plural(novos.length,'arquivo anexado','arquivos anexados'));taskView(id)}
async function anexoAbrir(path){const {data,error}=await GT.sb.storage.from('anexos').createSignedUrl(path,600);if(error||!data){toast('Não foi possível abrir o arquivo.');return}window.open(data.signedUrl,'_blank')}
function anexoApagar(id,i){const t=D.tarefas.get(id);const a=t&&(t.anexos||[])[i];if(!a)return;confirmBox(`Apagar o anexo <b>${esc(a.nome)}</b>?`,'Apagar',async()=>{const {error}=await GT.sb.storage.from('anexos').remove([a.path]);if(error){toast('Só quem enviou ou o gestor pode apagar.');return}
  const now=agora();await put('tarefas',id,Object.assign({},t,{anexos:t.anexos.filter((_,j)=>j!==i),atualizadoEm:now,hist:(t.hist||[]).concat([{em:now,tipo:'nota',txt:'Apagou o anexo '+a.nome,por:ME}])}));taskView(id)})}
function checkToggle(id,i){const t=D.tarefas.get(id);if(!t||!t.check||!t.check[i])return;const ck=t.check.map((x,j)=>j===i?Object.assign({},x,{ok:!x.ok,por:ME,em:agora()}):x);
  put('tarefas',id,Object.assign({},t,{check:ck,atualizadoEm:agora()}));setTimeout(()=>taskView(id),120)}
function checkAdd(id,txt){const t=D.tarefas.get(id);if(!t||!txt)return;put('tarefas',id,Object.assign({},t,{check:(t.check||[]).concat([{txt,ok:false}]),atualizadoEm:agora()}));setTimeout(()=>taskView(id),120)}
function statusTxt(s){return {afazer:'Voltou para A fazer',andamento:'Iniciada (Em andamento)',aguard_cliente:'Aguardando cliente',aguard_orgao:'Aguardando órgão público',concluida:'Concluída'}[s]}
function setStatus(id,s){
  const t=D.tarefas.get(id);if(!t||t.status===s)return;const now=agora();
  const n=Object.assign({},t,{status:s,atualizadoEm:now,hist:(t.hist||[]).concat([{em:now,tipo:'status',txt:statusTxt(s),por:ME}])});
  n.concluidoEm=s==='concluida'?now:'';
  put('tarefas',id,n);toast(ST[s].l);
}
function taskView(id){
  const t=D.tarefas.get(id);if(!t)return;const i=info(t);
  const hist=(t.hist||[]).slice().sort((a,b)=>a.em.localeCompare(b.em));
  const cMap={criada:'var(--dim)',status:'var(--blu)',cobranca:'var(--red)',prazo:'var(--amb)',nota:'var(--acc)',resp:'var(--vio)',protocolo:'var(--vio)'};
  openModal(`${mh(esc(t.titulo))}<div class="mb"><div class="split">
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${modTag(t)} ${pill(t.status)} ${prio(t.prioridade)} ${i.atraso?`<span class="flag red">Atrasada ${plural(i.atraso,'dia','dias')}</span>`:''}${i.parado?`<span class="flag amb">Sem atualização há ${i.semUpd}d</span>`:''}</div>
      <dl class="dl">
        <dt>Empresa</dt><dd>${t.empresaId?`<a href="#" data-emp="${t.empresaId}">${esc(empNome(t.empresaId))}</a> ${donoTagId(t.empresaId)}`:'—'}</dd>
        <dt>Categoria</dt><dd>${esc(t.categoria||'—')}</dd>
        <dt>Solicitado por</dt><dd>${esc(t.solicitante||'—')}</dd>
        <dt>Departamento</dt><dd>${esc(t.departamento||'—')}</dd>
        <dt>Responsável</dt><dd>${esc(t.responsavel||'—')}${apoioDe(t).length?`<div style="font-size:12px;color:var(--mut)">com ${esc(apoioDe(t).join(', '))}</div>`:''}</dd>
        <dt>Prazo</dt><dd class="mono">${fmt(t.prazo)}</dd>
        <dt>Criada em</dt><dd class="mono">${fmt(t.criadoEm)}</dd>
        <dt>Concluída em</dt><dd class="mono">${fmt(t.concluidoEm)}</dd>
        <dt>Dias em aberto</dt><dd class="mono">${i.emAberto}</dd>
        <dt>Tempo gasto</dt><dd><span class="mono">${minTxt(tempoAtual(t))}</span>${t.timer&&t.timer.desde?` <span class="flag grn">⏱ rodando · ${esc(t.timer.por||'')}</span>`:''} <button type="button" class="btn sm ${t.timer&&t.timer.desde?'pri':''}" id="tmBtn">${t.timer&&t.timer.desde?'Pausar':'Iniciar'}</button> <button type="button" class="btn ghost sm" id="tmAdd">+ Lançar</button></dd>
        ${t.gcal&&t.gcal.id?`<dt>Google Agenda</dt><dd>${t.gcal.link?`<a href="${esc(t.gcal.link)}" target="_blank" rel="noopener">Ver evento</a>`:'Na agenda'}</dd>`:''}
      </dl>
      <div><div class="sec-t" style="display:flex;align-items:center;gap:8px">Protocolos<span style="flex:1"></span><button class="btn sm" type="button" id="pAddBtn">${svg('plus',2.2)}Protocolo</button></div>
        <div class="plist">${(t.protocolos||[]).map(p=>{const ab=p.status==='analise'||p.status==='exigencia';return `<div class="prot"><div style="min-width:0"><div class="pn">${esc(p.numero||'sem número')}</div><div class="po">${esc(p.orgao)} · protocolado ${fmt(p.data)}${p.link?` · <a href="${esc(p.link)}" target="_blank" rel="noopener">acompanhar</a>`:''}</div></div>
          <div class="pa">${ab?`<span class="pd" style="color:${protCor(p)}">${protDias(p)}d ${p.status==='exigencia'?'em exigência':'no órgão'}</span>`:''}<select class="sel" data-pst="${p.id}" aria-label="Situação do protocolo">${Object.entries(PST).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v.l}</option>`).join('')}</select><button class="xbtn" data-pdel="${p.id}" aria-label="Excluir protocolo">${svg('x',2.2)}</button></div></div>`}).join('')||'<div style="font-size:12px;color:var(--dim)">Nenhum protocolo registrado.</div>'}</div>
        <form class="padd" id="pAdd" hidden>
          <div class="fd"><label for="p_org">Órgão</label><select class="sel" id="p_org">${ORGAOS.map(o=>`<option ${t.categoria&&o.toLowerCase().includes(t.categoria.toLowerCase().split(' ')[0])?'selected':''}>${o}</option>`).join('')}</select></div>
          <div class="fd"><label for="p_num">Nº do protocolo</label><input class="inp mono" id="p_num" placeholder="Ex.: 26/123456-7"></div>
          <div class="fd"><label for="p_dt">Data do protocolo</label><input class="inp" type="date" id="p_dt" value="${hoje()}"></div>
          <div class="fd"><label for="p_lk">Link de acompanhamento</label><input class="inp" id="p_lk" type="url" placeholder="https://"></div>
          ${t.status!=='aguard_orgao'&&t.status!=='concluida'?`<label class="chk full"><input type="checkbox" id="p_st" checked> Mudar a tarefa para Aguardando órgão público</label>`:''}
          <div class="full" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn sm" id="pCancel">Cancelar</button><button class="btn pri sm" type="submit">Salvar protocolo</button></div>
        </form>
      </div>
      ${(t.check&&t.check.length)||t.status!=='concluida'?(()=>{const ck=t.check||[],f=ck.filter(x=>x.ok).length;return `<div><div class="sec-t" style="display:flex;gap:8px;align-items:center">Checklist${ck.length?` <small style="font-weight:400;color:var(--dim)">${f}/${ck.length}</small>`:''}</div>${ck.length?`<div class="ck-bar"><i style="width:${Math.round(f/ck.length*100)}%"></i></div>`:''}
        ${ck.map((x,j)=>`<label class="ck-it ${x.ok?'ok':''}"><input type="checkbox" data-ck="${j}" ${x.ok?'checked':''}><span>${esc(x.txt)}</span>${x.ok&&x.por?`<small style="margin-left:auto;color:var(--dim);font-size:11px">${esc(x.por)}</small>`:''}</label>`).join('')}
        <form class="note-add" id="ckF" style="margin-top:6px"><input class="inp" id="ckN" placeholder="Adicionar item ao checklist"><button class="btn sm" type="submit">Adicionar</button></form></div>`})():''}
      ${mode==='db'?`<div><div class="sec-t" style="display:flex;align-items:center;gap:8px">Anexos${(t.anexos||[]).length?` <small style="font-weight:400;color:var(--dim)">${t.anexos.length}</small>`:''}<span style="flex:1"></span><label class="btn sm" style="cursor:pointer">${svg('plus',2.2)}Anexar<input type="file" id="axIn" multiple hidden></label></div>
        ${(t.anexos||[]).map((a,j)=>`<div class="ck-it"><button type="button" class="lg-link" data-ax="${j}" style="all:unset;cursor:pointer;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">📎 ${esc(a.nome)}</button><small style="color:var(--dim);font-size:11px">${fmtTam(a.tam||0)} · ${esc(a.por||'')}</small><button type="button" class="xbtn" data-axdel="${j}" aria-label="Apagar anexo">${svg('x',2)}</button></div>`).join('')||'<div style="font-size:12px;color:var(--dim)">Protocolos, guias, comprovantes… até 10 MB cada.</div>'}</div>`:''}
      ${t.descricao?`<div><div class="sec-t">Descrição</div><div style="white-space:pre-wrap">${esc(t.descricao)}</div></div>`:''}
      ${t.obs?`<div><div class="sec-t">Observações</div><div style="white-space:pre-wrap;color:var(--mut)">${esc(t.obs)}</div></div>`:''}
      <div><div class="sec-t">Mudar status</div><select class="sel" id="v_st" style="width:100%">${STK.map(k=>`<option value="${k}" ${t.status===k?'selected':''}>${ST[k].l}</option>`).join('')}</select></div>
    </div>
    <div style="min-width:0"><div class="sec-t">Histórico</div>
      <div class="tl">${hist.map(x=>`<div class="tli"><span class="d">${fmtC(x.em)}</span><span class="k" style="--c:${cMap[x.tipo]||'var(--dim)'}"></span><span class="x">${x.tipo==='cobranca'?'<b>Cobrança:</b> ':''}${esc(x.txt)}${x.por?`<small>${esc(x.por)}</small>`:''}</span></div>`).join('')||'<div class="empty">Sem registros.</div>'}</div>
      <form id="noteF" class="note-add" style="margin-top:10px"><input class="inp" id="v_note" placeholder="Registrar andamento (ex.: Documento enviado para Junta)"><button class="btn sm" type="submit">Registrar</button></form>
    </div>
  </div></div><div class="mf"><button class="btn ghost" data-edit-task="${id}">${svg('edit')}Editar</button><a class="btn ghost" href="${waLink(telDe(t.responsavel),msgTarefa(t))}" target="_blank" rel="noopener" title="${telDe(t.responsavel)?'Enviar para '+esc(t.responsavel):'Escolher o contato no WhatsApp'}">${svg('wa')}Avisar responsável</a>${(empresa(t.empresaId)||{}).whatsapp?`<a class="btn ghost" href="${waLink(empresa(t.empresaId).whatsapp,msgCliente(t))}" target="_blank" rel="noopener">${svg('wa')}Cliente</a>`:''}<button class="btn ghost" data-pdf="task:${id}">${svg('pdf')}PDF</button><button class="btn ghost danger" data-del-task="${id}" style="margin-right:auto">Excluir</button>${i.aberta?`<button class="btn warn" data-cobrar="${id}">${svg('bell',2)}Cobrar</button>`:''}${i.aberta?`<button class="btn" data-concluir="${id}">Concluir</button>`:''}</div>`,true);
  $('#v_st').addEventListener('change',e=>{setStatus(id,e.target.value);taskView(id)});
  $('#tmBtn').addEventListener('click',()=>tempoToggle(id));
  if(document.getElementById('axIn'))$('#axIn').addEventListener('change',ev=>anexoEnviar(id,[...ev.target.files]));
  document.querySelectorAll('[data-ax]').forEach(b=>b.addEventListener('click',()=>anexoAbrir((D.tarefas.get(id).anexos||[])[+b.dataset.ax].path)));
  document.querySelectorAll('[data-axdel]').forEach(b=>b.addEventListener('click',()=>anexoApagar(id,+b.dataset.axdel)));$('#tmAdd').addEventListener('click',()=>tempoLancar(id));
  document.querySelectorAll('[data-ck]').forEach(c=>c.addEventListener('change',()=>checkToggle(id,+c.dataset.ck)));
  if(document.getElementById('ckF'))$('#ckF').addEventListener('submit',ev=>{ev.preventDefault();checkAdd(id,val('ckN'))});
  $('#pAddBtn').addEventListener('click',()=>{const f=$('#pAdd');f.hidden=!f.hidden;if(!f.hidden)$('#p_num').focus()});
  $('#pCancel').addEventListener('click',()=>{$('#pAdd').hidden=true});
  $('#pAdd').addEventListener('submit',ev=>{ev.preventDefault();
    const tt=D.tarefas.get(id),now=agora(),dt=val('p_dt')||hoje();
    const p={id:uid(),orgao:val('p_org'),numero:val('p_num'),data:dt,link:val('p_lk'),status:'analise',desde:dt};
    const h=(tt.hist||[]).concat([{em:now,tipo:'protocolo',txt:`Protocolado em ${orgCurto(p.orgao)}${p.numero?' nº '+p.numero:''} (${fmt(dt)})`,por:ME}]);
    const n=Object.assign({},tt,{protocolos:(tt.protocolos||[]).concat([p]),atualizadoEm:now,hist:h});
    const chk=document.getElementById('p_st');if(chk&&chk.checked){n.status='aguard_orgao';h.push({em:now,tipo:'status',txt:statusTxt('aguard_orgao'),por:ME})}
    put('tarefas',id,n);taskView(id);toast('Protocolo registrado')});
  document.querySelectorAll('[data-pst]').forEach(sel=>sel.addEventListener('change',e=>{
    const tt=D.tarefas.get(id),now=agora(),pid=e.target.dataset.pst,ns=e.target.value;
    const ps=(tt.protocolos||[]).map(p=>p.id===pid?Object.assign({},p,{status:ns,desde:hoje()}):p);const p=ps.find(x=>x.id===pid);
    const h=(tt.hist||[]).concat([{em:now,tipo:'protocolo',txt:`${orgCurto(p.orgao)}${p.numero?' nº '+p.numero:''}: ${PST[ns].l.toLowerCase()}`,por:ME}]);
    const n=Object.assign({},tt,{protocolos:ps,atualizadoEm:now,hist:h});
    if(ns==='exigencia'&&tt.status==='aguard_orgao'){n.status='andamento';h.push({em:now,tipo:'status',txt:'Exigência a cumprir: voltou para Em andamento',por:ME})}
    if(ns==='analise'&&tt.status==='andamento'){n.status='aguard_orgao';h.push({em:now,tipo:'status',txt:statusTxt('aguard_orgao'),por:ME})}
    put('tarefas',id,n);taskView(id);toast('Protocolo: '+PST[ns].l)}));
  document.querySelectorAll('[data-pdel]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();
    const pid=b.dataset.pdel;openModal(`${mh('Excluir protocolo')}<div class="mb">Excluir este protocolo da tarefa?</div><div class="mf"><button class="btn" id="pNo">Cancelar</button><button class="btn warn" id="pYes">Excluir</button></div>`);
    $('#pNo').addEventListener('click',()=>taskView(id));
    $('#pYes').addEventListener('click',()=>{const tt=D.tarefas.get(id);put('tarefas',id,Object.assign({},tt,{protocolos:(tt.protocolos||[]).filter(p=>p.id!==pid)}));taskView(id);toast('Protocolo excluído')})}));
  $('#noteF').addEventListener('submit',ev=>{ev.preventDefault();const txt=val('v_note');if(!txt)return;const now=agora();const tt=D.tarefas.get(id);
    put('tarefas',id,Object.assign({},tt,{atualizadoEm:now,hist:(tt.hist||[]).concat([{em:now,tipo:'nota',txt,por:ME}])}));taskView(id);toast('Andamento registrado')});
}
function cobrarForm(id){
  const t=D.tarefas.get(id);if(!t)return;const i=info(t);
  openModal(`${mh('Cobrar andamento')}<form id="cf"><div class="mb">
    <div><b>${esc(t.titulo)}</b> — ${esc(empNome(t.empresaId))}<div class="meta" style="margin-top:4px"><span>Responsável: <b>${esc(t.responsavel||'—')}</b></span><span>Prazo: <b class="mono">${fmt(t.prazo)}</b></span>${i.atraso?`<span class="late">${plural(i.atraso,'dia','dias')} de atraso</span>`:''}</div></div>
    <div class="fg"><div class="fd"><label for="c_data">Data da cobrança</label><input class="inp" type="date" id="c_data" value="${hoje()}"></div>
    <div class="fd"><label for="c_prazo">Novo prazo (opcional)</label><input class="inp" type="date" id="c_prazo"></div>
    <div class="fd full"><label for="c_obs">Observação</label><textarea class="inp" id="c_obs">Solicitado retorno sobre o andamento${t.categoria?' da '+esc(t.categoria.toLowerCase()):''}.</textarea></div></div>
  </div><div class="mf"><button type="button" class="btn" data-close>Cancelar</button><button class="btn warn" type="submit">Registrar cobrança</button></div></form>`);
  $('#cf').addEventListener('submit',ev=>{ev.preventDefault();
    const d=val('c_data')||hoje(),np=val('c_prazo'),obs=val('c_obs')||'Cobrado andamento';
    const time=agora().slice(10);const em=d+time;

const hkey=s=>norm(s).replace(/[^a-z0-9]/g,'');
function mapHeader(h){const k=hkey(h);if(!k)return null;for(const [f,al] of Object.entries(COLS))if(al.includes(k))return f;for(const [f,al] of Object.entries(COLS))if(al.some(a=>a.length>=6&&k.startsWith(a)))return f;return null}
function fixCNPJ(v){let d=String(v||'').replace(/\D/g,'');if(!d)return '';if(d.length>11&&d.length<14)d=d.padStart(14,'0');if(d.length===14)return maskCNPJ(d);if(d.length===11)return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');return String(v).trim()}
function fixRegime(v){const n=norm(v);if(!n)return '';if(n.includes('simples'))return 'Simples Nacional';if(n.includes('mei')||n.includes('microempreendedor'))return 'MEI';if(n.includes('presumido'))return 'Lucro Presumido';if(n.includes('real'))return 'Lucro Real';if(n.includes('isent')||n.includes('imune'))return 'Imune / Isenta';return String(v).trim()}
function parseCSV(txt){
  const sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const out=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));out.push(row);row=[];cur=''}else cur+=c}
  if(cur||row.length){row.push(cur);out.push(row)}
  return out;
}

function prepararImport(aoa,nome){

  const seen=new Set();const itens=[];
  aoa.slice(hi+1).forEach(r=>{
    const o={};map.forEach((f,i)=>{if(f&&r[i]!=null&&String(r[i]).trim()&&!o[f])o[f]=String(r[i]).trim()});
    if(!o.razao&&o.fantasia)o.razao=o.fantasia;

    if(o.honorario!=null){let v=String(o.honorario).replace(/[^\d,.-]/g,'');if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.');else if(v.includes(','))v=v.replace(',','.');const n=parseFloat(v);if(isNaN(n))delete o.honorario;else o.honorario=n}
    if(o.diaPagamento!=null){const d=parseInt(String(o.diaPagamento).replace(/\D/g,''),10);if(d>=1&&d<=31)o.diaPagamento=d;else delete o.diaPagamento}
    if(o.formaPagamento){const f=norm(o.formaPagamento);o.formaPagamento=f.includes('pix')?'Pix':f.includes('boleto')?'Boleto':f.includes('transf')||f.includes('ted')?'Transferência':f.includes('dinheiro')||f.includes('especie')?'Dinheiro':String(o.formaPagamento).trim()}
    if(o.inicioCobranca){const m=String(o.inicioCobranca).match(/(\d{1,2})[\/-](\d{4})|(\d{4})-(\d{1,2})/);o.inicioCobranca=m?(m[2]?m[2]+'-'+pad(+m[1]):m[3]+'-'+pad(+m[4])):undefined;if(!o.inicioCobranca)delete o.inicioCobranca}
    const d=(o.cnpj||'').replace(/\D/g,''),k=d||hkey(o.razao);
    let st='nova',id=null;
    if(!o.razao)st='invalida';
    else if(seen.has(k))st='repetida';
    else{id=(d&&byCnpj.get(d))||byNome.get(hkey(o.razao))||null;if(id)st='existe'}
    seen.add(k);itens.push({o,st,id});
  });
  IMP={itens,nome};
  const c=s=>itens.filter(x=>x.st===s).length;
  const lbl={nova:['grn','Nova'],existe:['amb','Já cadastrada'],repetida:['','Repetida na planilha'],invalida:['red','Sem razão social']};
  $('#impBody').innerHTML=`<div><b>${esc(nome)}</b> · ${plural(itens.length,'linha lida','linhas lidas')}</div>
    <div class="imp-sum"><span class="flag grn">${c('nova')} novas</span><span class="flag amb">${c('existe')} já cadastradas</span>${c('repetida')?`<span class="flag">${c('repetida')} repetidas</span>`:''}${c('invalida')?`<span class="flag red">${c('invalida')} sem razão social</span>`:''}</div>
    <div class="fd"><label for="impModo">Empresas já cadastradas</label><select class="sel" id="impModo"><option value="atualizar">Atualizar com os dados da planilha</option><option value="ignorar">Manter como estão (ignorar)</option></select></div>
    <div class="tw" style="border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto"><table><thead><tr><th>Razão social</th><th>CNPJ</th><th>Regime</th><th>Situação</th></tr></thead><tbody>
    ${itens.slice(0,60).map(x=>`<tr><td>${esc(x.o.razao||'—')}${x.o.fantasia&&x.o.fantasia!==x.o.razao?`<div class="cat">${esc(x.o.fantasia)}</div>`:''}</td><td class="num">${esc(x.o.cnpj||'—')}</td><td>${esc(x.o.regime||'—')}</td><td><span class="flag ${lbl[x.st][0]}">${lbl[x.st][1]}</span></td></tr>`).join('')}
    </tbody></table></div>${itens.length>60?`<div class="cols">Mostrando 60 de ${itens.length} linhas.</div>`:''}

async function executarImport(){

  const temGov=IMP.itens.some(x=>x.o.govSenha);
  if(temGov&&WS==='pessoal'&&!COFRE.key){const b=document.createElement('div');$('#impBody').prepend(b);cofreInline(b,()=>{b.remove();executarImport()},'A planilha tem senhas gov.br. Digite a senha do espaço Lucas para guardá-las criptografadas.');return}
  for(const x of IMP.itens){if(x.o.govSenha){if(WS==='pessoal'){try{x.o.govEnc=await cofreEnc(String(x.o.govSenha))}catch(e){}}delete x.o.govSenha}}
  const modo=val('impModo');const btn=$('#impGo');btn.disabled=true;btn.style.pointerEvents='none';btn.textContent='Importando…';
  const todo=IMP.itens.filter(x=>x.st==='nova'||(x.st==='existe'&&modo==='atualizar'));
  const pr=$('#impProg');pr.hidden=false;const bar=pr.querySelector('i');
  let novas=0,atual=0,falhas=0;const now=agora();
  for(let i=0;i<todo.length;i++){
    const x=todo[i];let id,data;
    if(x.st==='nova'){id=uid();data=Object.assign({criadoEm:now,proxContato:null},x.o)}
    else{id=x.id;const old=D.empresas.get(id)||{};const o2=Object.assign({},x.o);if(old.obs&&o2.obs&&!old.obs.includes(o2.obs))o2.obs=old.obs+'\n'+o2.obs;else if(old.obs)delete o2.obs;data=Object.assign({},old,o2)}
    data=JSON.parse(JSON.stringify(data));
    try{if(mode==='db')await C('empresas').doc(id).set(data);D.empresas.set(id,data);x.st==='nova'?novas++:atual++}
    catch(e){falhas++;if(e&&e.code==='quota_exceeded')break}
    bar.style.width=Math.round((i+1)/todo.length*100)+'%';
  }
  if(mode!=='db')persistLocal();

  toast(`${novas} empresa${novas===1?'':'s'} importada${novas===1?'':'s'}${atual?`, ${atual} atualizada${atual===1?'':'s'}`:''}${falhas?` · ${falhas} com erro`:''}`);
  if(UI.view!=='empresas')go('empresas');
}

function excluirEmpresas(ids){
  ids=ids.filter(id=>D.empresas.has(id));if(!ids.length)return;
  const set=new Set(ids);
  const nt=[...D.tarefas.values()].filter(t=>set.has(t.empresaId)).length;
  const nc=[...D.contatos.values()].filter(c=>set.has(c.empresaId)).length;
  const nome=ids.length===1?esc(empNome(ids[0])):plural(ids.length,'empresa','empresas');
  openModal(`${mh('Excluir '+(ids.length===1?'empresa':'empresas'))}<div class="mb"><div>Excluir <b>${nome}</b>? Essa ação não pode ser desfeita.</div>
    ${nt||nc?`<label class="chk"><input type="checkbox" id="delVinc" checked> Excluir também ${[nt?plural(nt,'tarefa','tarefas'):'',nc?plural(nc,'contato','contatos'):''].filter(Boolean).join(' e ')} vinculados</label>`:''}
    <div class="prog" id="delProg" hidden><i></i></div></div>
    <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn warn" id="delGo">Excluir</button></div>`);
  $('#delGo').addEventListener('click',async()=>{
    const b=$('#delGo');b.disabled=true;b.style.pointerEvents='none';b.textContent='Excluindo…';
    const vinc=document.getElementById('delVinc');const alsoV=vinc&&vinc.checked;
    const jobs=[];ids.forEach(id=>jobs.push(['empresas',id]));
    if(alsoV){D.tarefas.forEach((t,id)=>{if(set.has(t.empresaId))jobs.push(['tarefas',id])});D.contatos.forEach((c,id)=>{if(set.has(c.empresaId))jobs.push(['contatos',id])})}
    const pr=$('#delProg');pr.hidden=false;const bar=pr.querySelector('i');let falhas=0;
    for(let k=0;k<jobs.length;k++){const [col,id]=jobs[k];
      const old=D[col].get(id);if(old)gcalDrop(old,col==='empresas'?'c':'t');
      try{if(mode==='db')await C(col).doc(id).delete();D[col].delete(id)}catch(e){falhas++}
      bar.style.width=Math.round((k+1)/jobs.length*100)+'%'}
    if(mode!=='db')persistLocal();
    UI.sel.clear();UI.selMode=false;closeModal();
    if(UI.view==='empresa'&&set.has(UI.empresaId))go('empresas');else render();
    toast(falhas?`${falhas} item(ns) não puderam ser excluídos`:`${plural(ids.length,'empresa excluída','empresas excluídas')}`);
  });
}

function waQuem(){try{return localStorage.getItem('cs.wa.quem')||'ambos'}catch(e){return 'ambos'}}
function waAlvos(){if(WS==='pessoal')return ['Lucas'];const q=waQuem();return q==='lucas'?['Lucas']:q==='thais'?['Thais']:['Lucas','Thais']}
const WA_LINE=[
  /^\[?(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\]?\s*(?:-\s*)?([^:]{1,60}):\s?(.*)$/,
  /^\[(\d{1,2}):(\d{2}),\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})\]\s*([^:]{1,60}):\s?(.*)$/
];
function waParse(txt){
  const out=[];txt.replace(/\r/g,'').replace(/[\u200e\u200f\u202a-\u202e]/g,'').split('\n').forEach(l=>{
    let m=l.match(WA_LINE[0]),d;
    if(m){d={dia:+m[1],mes:+m[2],ano:+m[3]<100?2000+ +m[3]:+m[3],h:m[4],mi:m[5],autor:m[6].trim(),txt:m[7]}}
    else if((m=l.match(WA_LINE[1]))){d={h:m[1],mi:m[2],dia:+m[3],mes:+m[4],ano:+m[5]<100?2000+ +m[5]:+m[5],autor:m[6].trim(),txt:m[7]}}
    if(d){d.iso=`${d.ano}-${pad(d.mes)}-${pad(d.dia)}T${pad(d.h)}:${d.mi}`;out.push(d)}
    else if(out.length&&l.trim())out[out.length-1].txt+='\n'+l;
  });return out;
}
function waMarcou(msg,alvos){const t=norm(msg.txt.replace(/[\u2068\u2069]/g,''));return alvos.some(a=>{const n=norm(a).replace(/\s+/g,'');const dig=a.replace(/\D/g,'');return t.replace(/\s+/g,'').includes('@'+n)||(dig.length>=8&&t.replace(/\D/g,' ').includes(dig.slice(-8)))||new RegExp('@'+norm(a).split(' ')[0]).test(t)})}
async function waImportar(files,sample){
  const info=$('#waInfo');files=[...(files||[])];if(!files.length)return;
  let textos=[];
  for(const f of files){
    try{
      if(/\.zip$/i.test(f.name)||f.type.includes('zip')){if(!window.JSZip){info.textContent='Leitor de .zip não carregou. Extraia o arquivo .txt e envie ele.';return}
        const z=await JSZip.loadAsync(f);for(const n of Object.keys(z.files))if(/\.txt$/i.test(n))textos.push({nome:f.name,txt:await z.files[n].async('string')})}
      else textos.push({nome:f.name,txt:await f.text()});
    }catch(e){info.textContent='Não consegui abrir "'+f.name+'".';return}
  }
  const alvos=waAlvos().concat(waAlvos().map(n=>telDe(n)).filter(Boolean));let achadas=[];
  textos.forEach(({nome,txt})=>{const msgs=waParse(txt);const chave='cs.wa.ult.'+norm(nome).replace(/[^a-z0-9]/g,'').slice(0,60);
    let ult='';try{ult=localStorage.getItem(chave)||''}catch(e){}
    const desde=ult||addD(hoje(),-15)+'T00:00';
    msgs.forEach((m,i)=>{if(m.iso>desde&&waMarcou(m,alvos)){const ctx=msgs.slice(Math.max(0,i-2),i).filter(x=>x.iso>=addD(m.iso.slice(0,10),-1));achadas.push({m,ctx,conv:nome.replace(/\.(txt|zip)$/i,'').replace(/^Conversa do WhatsApp com /i,'')})}});
    const max=msgs.reduce((a,m)=>m.iso>a?m.iso:a,'');if(max)try{localStorage.setItem(chave+'.pend',max)}catch(e){}
    IA.waChaves=(IA.waChaves||[]).concat([chave]);
  });
  if(!achadas.length){info.innerHTML=`Nenhuma mensagem nova marcando ${esc(alvos.join(' ou '))} ${textos.length?'desde a última importação (ou nos últimos 15 dias)':''}.`;return}
  const fmtM=m=>`[${pad(m.dia)}/${pad(m.mes)} ${pad(m.h)}:${m.mi}] ${m.autor}: ${m.txt}`;
  $('#iaTxt').value=achadas.map(a=>`Conversa: ${a.conv}\n${a.ctx.map(c=>'  (contexto) '+fmtM(c)).join('\n')}${a.ctx.length?'\n':''}${fmtM(a.m)}`).join('\n\n');
  info.innerHTML=`<b style="color:var(--grn)">${plural(achadas.length,'mensagem','mensagens')}</b> marcando ${esc(alvos.join(' ou '))}. Interpretando…`;
  IA.waOrigem=true;iaRun(sample);
}

async function finDesbloquear(){
  const p1=val('finP'),err=$('#finErr');if(!err)return;
  if(p1.length<4){err.textContent='Use pelo menos 4 caracteres.';return}
  try{
    const d=await cfgRef().get();const cfg=d.exists?d.data():{};
    if(!cfg.finHash){
      if(p1!==val('finP2')){err.textContent='As senhas não conferem.';return}
      const h=await hashSenha(p1);const upd={finHash:h.hash,finSalt:h.salt};
      try{await cfgRef().update(upd)}catch(e){await cfgRef().set(Object.assign({},cfg,upd))}
      FIN.temSenha=true;
    }else{const h=await hashSenha(p1,cfg.finSalt);if(h.hash!==cfg.finHash){err.textContent='Senha incorreta.';const i=$('#finP');i.value='';i.focus();return}}
    FIN.ok=true;try{sessionStorage.setItem('cs.finOk','1')}catch(e){}
    render();toast('Financeiro desbloqueado');
  }catch(e){err.textContent='Não foi possível verificar a senha agora.'}
}

async function asDrive(dr,signal){
  if(!mcp)return 'Google Drive indisponível nesta visualização (abra o sistema pelo Claude e libere o Google Drive).';
  try{
    if(dr.buscar){
      const t=String(dr.buscar).replace(/\\/g,'').replace(/'/g,"\\'").slice(0,80);
      const ts=[t].concat(t.replace(/\D/g,'').length>=8&&t.replace(/\D/g,'')!==t?[t.replace(/\D/g,'')]:[]);
      const query=ts.map(x=>`title contains '${x}' or fullText contains '${x}'`).join(' or ');
      const r=await mcp.callTool(GD,'search_files',{query,pageSize:10,excludeContentSnippets:true},{signal});
      const fs=((r.payload&&r.payload.files)||[]).filter(f=>f&&f.id);
      return fs.length?'Arquivos encontrados (id | nome | tipo | modificado):\n'+fs.map(f=>[f.id,f.title||'',f.mimeType||'',(f.modifiedTime||'').slice(0,10)].join(' | ')).join('\n'):'Nenhum arquivo encontrado para "'+dr.buscar+'".';
    }
    if(dr.ler){
      const r=await mcp.callTool(GD,'read_file_content',{fileId:String(dr.ler)},{signal});
      let txt=gdTexto(r.payload);if(!txt&&r.content)txt=r.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
      return txt&&txt.trim()?`Conteúdo de "${dr.nome||dr.ler}" (pode estar cortado):\n${txt.slice(0,40000)}`:'Não consegui ler o conteúdo desse arquivo.';
    }
  }catch(e){if(signal&&signal.aborted)throw {code:'cancelled'};return 'Erro no Google Drive: '+gdErr(e)}
  return 'Pedido de Drive inválido.';
}
async function asEnviar(texto){

        continue;
      }

      AS.msgs.push({role:'assistant',content:JSON.stringify({resposta:resp,acoes}),texto:resp||(acoes.length?'Confira e confirme:':'Pronto.'),acoes,drive:driveTxt});

}

function rbVejo(nome){if(MESTRE.ok)return true;const n=rbNivel();if(n==='total')return true;if(souEu(nome))return true;if(n==='depto')return norm(depDe(nome))===norm(rbMeuDep());return false}

function rbPodeAssinar(v){const n=rbNivel();if(!n||!v)return false;

async function rbComprimir(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const max=1000;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let q=.62,d=c.toDataURL('image/jpeg',q);while(d.length>170000&&q>.3){q-=.08;d=c.toDataURL('image/jpeg',q)}
    if(d.length>230000){const c2=document.createElement('canvas');c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);d=c2.toDataURL('image/jpeg',.5)}
    return d;
  }finally{URL.revokeObjectURL(url)}
}

const FER_FIXOS=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return isoD(new Date(y,mes-1,dia))}
function feriado(s){if(!s)return false;if(FER_FIXOS.includes(s.slice(5,10)))return true;const p=pascoa(+s.slice(0,4));return [addD(p,-48),addD(p,-47),addD(p,-2),addD(p,60)].includes(s.slice(0,10))}
const rbOrd=x=>(x.data||'')+'|'+String(x.kmIni||0).padStart(9,'0')+'|'+(x.criadoEm||'');
function rbAnterior(id,v){return [...RB.viagens.entries()].filter(([k,x])=>k!==id&&x.status!=='recusada'&&x.veiculoId===v.veiculoId&&rbOrd(x)<rbOrd(v)).map(([k,x])=>x).sort((a,b)=>rbOrd(b).localeCompare(rbOrd(a)))[0]||null}
function rbUltKm(vid){let m=null;RB.viagens.forEach(x=>{if(x.veiculoId===vid&&x.status!=='recusada'&&(m==null||x.kmFim>m))m=x.kmFim});return m}
function rbAlertas(id,v){
  const out=[];if(!v||!v.data)return out;
  const dw=toD(v.data).getDay();
  if(dw===0||dw===6)out.push(['amb','Fim de semana']);else if(feriado(v.data))out.push(['amb','Feriado']);
  const outras=[...RB.viagens.entries()].filter(([k,x])=>k!==id&&x.status!=='recusada');
  const mesmo=outras.filter(([k,x])=>x.veiculoId===v.veiculoId);
  const sob=mesmo.filter(([k,x])=>v.kmIni<x.kmFim&&v.kmFim>x.kmIni);

  else{const ant=rbAnterior(id,v);if(ant&&v.kmIni<ant.kmFim)out.push(['red','Odômetro menor que na viagem de '+fmtC(ant.data)])}
  if(outras.some(([k,x])=>norm(x.pessoa)===norm(v.pessoa)&&x.data===v.data&&norm(x.destino).trim()===norm(v.destino).trim()))out.push(['amb','Mesmo destino no mesmo dia']);
  if(v.km>RB_KM_ALTO)out.push(['amb','Km alto ('+v.km+' km)']);

  return out;
}

function imgReduzir(file,lado,tipo){return new Promise((ok,ruim)=>{if(!file||!/^image\//.test(file.type)){ruim(new Error('Escolha uma imagem (JPG ou PNG).'));return}
  const fr=new FileReader();fr.onerror=()=>ruim(new Error('Não consegui ler a imagem.'));fr.onload=()=>{const im=new Image();im.onerror=()=>ruim(new Error('Imagem inválida.'));im.onload=()=>{
    const l=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=lado;const cx=cv.getContext('2d');
    if(tipo==='image/jpeg'){cx.fillStyle='#fff';cx.fillRect(0,0,lado,lado)}cx.drawImage(im,(im.width-l)/2,(im.height-l)/2,l,l,0,0,lado,lado);ok(cv.toDataURL(tipo,.86))};im.src=fr.result};fr.readAsDataURL(file)})}

/* ---------- Relógio ---------- */
(function relogio(){
  const e=id=>document.getElementById(id);
  const reduz=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastS=-1;
  const frame=()=>{
    const d=new Date(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds(),ms=d.getMilliseconds();
    const sf=reduz?sec:sec+ms/1000;
    if(e('hS'))e('hS').style.transform=`rotate(${sf*6}deg)`;
    if(sec!==lastS){lastS=sec;
      const hm=pad(h)+':'+pad(m);
      if(e('cHM'))e('cHM').textContent=hm;
      if(e('cS'))e('cS').textContent=pad(sec);
      if(e('cHMm'))e('cHMm').textContent=hm;
      if(e('cDay'))e('cDay').textContent=d.getDate();
      const dt=`${DSEM[d.getDay()]} · ${d.getDate()} de ${MESES[d.getMonth()]}`;
      if(e('cDate')&&e('cDate').textContent!==dt)e('cDate').textContent=dt;
      const dm=`${DSEM[d.getDay()].slice(0,3)} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
      if(e('cDm')&&e('cDm').textContent!==dm)e('cDm').textContent=dm;
      if(e('hH'))e('hH').style.transform=`rotate(${(h%12)*30+m*.5+sec/120}deg)`;
      if(e('hM'))e('hM').style.transform=`rotate(${m*6+sec*.1}deg)`;
    }
    if(reduz)setTimeout(frame,1000-ms);else requestAnimationFrame(frame);
  };
  frame();
})();

    <figure class="end-foto"><img src="${END_FOTO}" alt="Fachada do escritório Londe & Rodrigues"></figure>
    <div class="end-info">
      <div><div class="end-k">Londe &amp; Rodrigues Assessoria Contábil</div><div class="end-adr"><b>${esc(END_L1)}</b><br>${esc(END_L2)}<br>${esc(END_L3)}</div></div>
      <div class="end-acts"><button type="button" class="btn sm" id="endCopy">${svg('copy')}Copiar endereço</button><a class="btn sm" href="${END_MAPS}" target="_blank" rel="noopener">${svg('pin2')}Abrir no mapa</a><button type="button" class="btn sm" id="endFoto">${svg('dl')}<span id="endFotoL">${navigator.canShare?'Compartilhar foto':'Baixar foto'}</span></button></div>
      <div class="fd"><label for="endDest">Enviar para</label><select class="sel" id="endDest"><option value="">Escolher o contato no WhatsApp</option>${ativos.map(([id,e])=>`<option value="${id}" ${id===empId?'selected':''}>${esc(e.fantasia||e.razao)}${e.responsavel?' · '+esc(e.responsavel.split(' ')[0]):''}</option>`).join('')}</select></div>
      <div class="fd"><label for="endTxt">Mensagem</label><textarea class="inp end-msg" id="endTxt"></textarea></div>
      <div style="font-size:12px;color:var(--dim)">O WhatsApp abre com o texto e o link do mapa. Para mandar a foto da fachada junto, use <b>Compartilhar foto</b> (no celular) ou baixe e anexe na conversa.</div>
    </div></div></div>
    <div class="mf"><button class="btn" data-close>Fechar</button><a class="btn pri" id="endWa" target="_blank" rel="noopener" href="#">${svg('wa',2)}Enviar no WhatsApp</a></div>`,true);
  const ta=$('#endTxt'),sel=$('#endDest');let editado=false;
  const link=()=>{const e=D.empresas.get(sel.value);$('#endWa').href=waLink(e?e.whatsapp:'',ta.value)};
  const gerar=()=>{if(!editado)ta.value=endMsg(D.empresas.get(sel.value));link()};
  sel.addEventListener('change',gerar);ta.addEventListener('input',()=>{editado=true;link()});
  $('#endCopy').addEventListener('click',()=>copiarTexto(END_TXT,'Endereço copiado'));
  $('#endWa').addEventListener('click',()=>{const eid=sel.value;if(eid&&D.empresas.has(eid))put('contatos',uid(),{empresaId:eid,data:hoje(),tipo:'WhatsApp',desc:'Enviado o endereço do escritório',responsavel:ME,criadoEm:agora()});setTimeout(closeModal,300)});
  $('#endFoto').addEventListener('click',async()=>{
    try{const f=await endFotoArquivo();
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Londe & Rodrigues',text:'Fachada do escritório · '+END_TXT})}catch(x){}return}
      const data=await f.arrayBuffer();const dl=await window.claude.use('downloads');if(!dl)throw {code:'unavailable'};await dl.save({filename:'fachada-londe-rodrigues.jpg',data});
    }catch(e){if(e&&e.code==='cancelled')return;const a=document.createElement('a');a.href=END_FOTO;a.download='fachada-londe-rodrigues.jpg';document.body.appendChild(a);a.click();a.remove()}
  });
  gerar();
}
document.addEventListener('click',ev=>{const t=ev.target.closest&&ev.target.closest('#btnEnd,[data-endereco]');if(!t)return;ev.preventDefault();ev.stopPropagation();const m=document.getElementById('menuMais');if(m)m.hidden=true;endModal(t.dataset.endereco||'')});
boot();
})();
</script>
<script>(function(){var b=document.getElementById('btnTema'),n=document.getElementById('temaNome');function s(){var t=document.documentElement.getAttribute('data-theme')||'dark';if(n)n.textContent=t==='dark'?'escuro':'claro'}s();function tg(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.classList.add('tema-anim');document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('cs.theme',t)}catch(e){}s();setTimeout(function(){document.documentElement.classList.remove('tema-anim')},450)}if(b)b.addEventListener('click',tg);var b2=document.getElementById('btnTemaTop');if(b2)b2.addEventListener('click',tg)})()</script>
