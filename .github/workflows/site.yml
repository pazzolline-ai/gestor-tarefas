name: Publicar sistema
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Montar site e versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && cp index.html manifest.webmanifest sw.js icon-*.png site/
          sed -i "s/__BUILD__/${GITHUB_SHA}/" site/index.html
          PC=$(gh api repos/${{ github.repository }}/releases/tags/programa-windows --jq .name 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo 1.0.0)
          echo "{\"site\":\"${GITHUB_SHA}\",\"programa\":\"${PC}\"}" > site/version.json
          cat site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
