name: App para Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
permissions:
  contents: write
  actions: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Conferir chave de assinatura
        env: { KS: '${{ secrets.ANDROID_KEYSTORE }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error::Falta o segredo ANDROID_KEYSTORE (veja o README)."; exit 1; fi
      - name: Montar projeto Android
        working-directory: mobile
        run: |
          sed -i "s/__VER__/${VER}/" capacitor.config.json
          npm install --no-audit --no-fund
          npx cap add android
          cp ../icon-512.png /tmp/icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp /tmp/icon.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done
          mkdir -p android/app/src/main/res/drawable && cp /tmp/icon.png android/app/src/main/res/drawable/ic_stat_icon.png
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${VER}\"/" android/app/build.gradle
          npx cap sync android
      - name: Gerar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Assinar APK
        env: { KS: '${{ secrets.ANDROID_KEYSTORE }}', PW: '${{ secrets.ANDROID_KEY_PASS }}' }
        run: |
          echo "$KS" | base64 -d > /tmp/gt.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/al.apk
          $BT/apksigner sign --ks /tmp/gt.jks --ks-pass env:PW --key-pass env:PW --ks-key-alias gestor --out Gestor-de-Tarefas.apk /tmp/al.apk
          rm /tmp/gt.jks
      - name: Publicar na página de downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: Gestor de Tarefas para Android ${{ env.VER }}
          body: App do Gestor de Tarefas para Android. Baixe Gestor-de-Tarefas.apk no celular e instale.
          files: Gestor-de-Tarefas.apk
          make_latest: false
      - name: Avisar os usuários
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run site.yml --ref main -R ${{ github.repository }}
